name: Validate Home Assistant App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate app metadata
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import yaml
          with open("nodejs_npx/config.yaml", encoding="utf-8") as f:
              config = yaml.safe_load(f)
          assert config["slug"] == "nodejs_npx"
          assert "amd64" in config["arch"]
          assert config["version"]
          assert "command" in config["schema"]
          print("App metadata OK")
          PY
      - name: Check JavaScript syntax
        run: node --check nodejs_npx/ha-bridge.js
      - name: Check shell syntax
        run: bash -n nodejs_npx/run.sh
      - name: Build amd64 container
        run: docker build --platform linux/amd64 -t homeassistant-npx:ci nodejs_npx
