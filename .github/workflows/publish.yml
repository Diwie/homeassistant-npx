name: Publish Home Assistant App Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          echo "version=$(python -c 'import yaml; print(yaml.safe_load(open("nodejs_npx/config.yaml"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: ./nodejs_npx
          platforms: linux/amd64
          push: true
          tags: ghcr.io/diwie/homeassistant-npx:${{ steps.version.outputs.version }}
